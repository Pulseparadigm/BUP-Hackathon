services:
  - type: web
    name: pulseparadigm-gridwise
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_SITE_NAME
        value: GridWise LLM
      - key: LLM_TIMEOUT_SECONDS
        value: "10"
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: LLM_FAILURE_MODE
        value: degrade
      - key: SOLVER_BACKEND
        value: highs
