name: Keep-alive ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health to prevent Render free-tier idle sleep
        run: |
          if [ -z "${{ vars.RENDER_HEALTH_URL }}" ]; then
            echo "RENDER_HEALTH_URL repo variable is not set yet -- skipping."
            exit 0
          fi
          curl -sf --max-time 25 "${{ vars.RENDER_HEALTH_URL }}" || echo "Ping failed (service may be cold-starting)."
